<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="user-input" type="password">
    <button id="bnt" onclick="bntPass()">Show</button>
    
    <script>
        const notshow = document.getElementById("bnt")
        const ShowPass = document.getElementById("user-input")
        function bntPass() {
            if(ShowPass.type === "password"){
                ShowPass.type ="text"
                notshow.innerText="Hide"
            }else{
                ShowPass.type ="password"
                notshow.innerText="Show"
            }
        }
    </script>


</body>
</html>
